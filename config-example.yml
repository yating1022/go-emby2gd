emby:
  host: http://192.168.0.109:8096 # emby 访问地址
  mount-path: /data # rclone/cd2 挂载的本地磁盘路径, 如果 emby 是容器部署, 这里要配的就是容器内部的挂载路径
  episodes-unplay-prior: true # 是否修改剧集排序, 让未播的剧集靠前排列; 启用该配置时, 会忽略原接口的分页机制
  resort-random-items: true # 是否重排序随机列表, 对 emby 的排序结果进行二次重排序, 使得列表足够随机
  # 代理异常处理策略
  # origin: 代理回源服务器处理
  # reject: 拒绝处理
  proxy-error-strategy: origin
  # 图片质量, 默认请求原图
  # 配置范围: [1, 100]
  # 建议范围: [70, 90]
  # 具体数值根据自己的实际情况作调整
  images-quality: 100
  # 是否强制返回原图
  # 开启后, 移除图片请求中的分辨率、格式等处理参数, 使 emby 直接返回原始图片文件
  # 客户端通常会按屏幕尺寸携带 maxWidth 等参数导致图片被压缩, 该开关可在代理层移除这些参数
  images-original: true
  strm: # 远程视频 strm 配置
    # 路径映射, 将 strm 文件内的路径片段替换成指定路径片段
    # 可配置多个映射, 每个映射需要有 2 个片段, 使用 [=>] 符号进行分割, 程序自上而下映射第一个匹配的结果
    # 这个配置的映射是比较灵活的, 不一定必须按照前缀映射, 可以直接将地址中间的片段给替换掉
    #
    # 举个栗子
    # strm 文件内容: https://test-res.com:8094/1.mp4, 替换结果: http://localhost:8095/1.mp4
    # strm 文件内容: https://test-res.com:12138/test-id-12138.mp4, 替换结果: https://test-res.com:10086/test-id-12138.mp4
    path-map:
      - https://test-res.com:8094 => http://localhost:8095
      - 12138 => 10086
    # 是否启用 strm 内部重定向
    #
    # 启用, 程序会在内部访问 strm 远程地址并重定向到最终地址后, 再重定向给客户端
    # 禁用, 程序会将 strm 的原始地址直接重定向给客户端
    internal-redirect-enable: false
    # strm 直链代理播放
    #
    # 命中 domains 中任一前缀的 strm 地址, 将由本项目代理请求上游并把字节流转发给客户端,
    # 客户端不会收到 302。适用于上游只对部署本项目服务器开放、客户端无法直连的场景。
    # 缺省整个 proxy 段时, 行为与改动前完全一致。
    proxy:
      # 总开关
      enable: false
      # 命中代理模式的地址前缀, 命中任一即生效, 按配置顺序取第一个匹配
      #
      # 需要锁定目标时把端口一并写上(如 http://vault.example.com:7811),
      # 需要锁定路径时写成 http://vault.example.com:7811/prefix
      # 启用代理时该项不能为空
      domains:
        - http://vault.example.com:7811
      # 直链缓存时长, 可配置单位: d(天), h(小时), m(分钟), s(秒)
      # 仅在上游返回 3xx 且跟随后的最终地址与原地址不同时才会写入缓存
      # 默认: 10m
      link-cache-expired: 10m
      # 上游重定向最大跟随跳数, 取值需在 [1, 10] 之间
      # 默认: 5
      max-redirect-depth: 5
      # 判定直链失效的状态码, 命中时清除缓存并重试一次上游请求
      # 默认: [403, 404, 410]
      retry-status-codes:
        - 403
        - 404
        - 410
      # 并发代理传输上限, 0 表示不限制
      # 需要注意的是: 该项完全缺省时取默认值 16; 显式写 0 才是"不限制"
      # 调整依据是日志中 [直链代理] 输出的实际并发峰值, 或上游出现连接拒绝
      # 默认: 16
      max-concurrent-streams: 16
      # 固定添加到上游请求的请求头, 可覆盖同名透传头
      # 例如上游要求特定 UA 或 Referer 时在此配置, 留空则不设置
      request-header:
        User-Agent: ""
  # emby 下载接口处理策略
  #    403: 禁用下载接口, 返回 403 响应
  # origin: 代理到源服务器
  # direct: 获取并重定向到直链地址
  download-strategy: 403
  # emby 本地媒体根目录
  # 检测到该路径为前缀的媒体时, 代理回源处理
  local-media-roots:
    - /data/local
    - /data/other
  # 自定义 css js 配置
  custom-css-js:
    # 调试模式开关
    # 开启时, 每次访问 emby 首页都会重新加载一次本地脚本文件
    debug-mode: false

# openlist 访问配置
openlist:
  host: http://192.168.0.109:5244 # openlist 访问地址
  token: openlist-xxxxx # openlist api key 可以在 openlist 管理后台查看
  # 将 openlist 目录树映射生成到磁盘, 并对特殊容器进行特定的转换
  # 具体使用方式可参考仓库 Readme 文档
  local-tree-gen:
    enable: false # 功能是否开启
    # 是否开启 ffmpeg 辅助
    #
    # 主要目的是在生成虚拟容器时, 解析视频的元数据, 供 emby 读取
    # 可能会有风控风险, 请根据实际情况自行决定是否开启
    ffmpeg-enable: false
    # 虚拟媒体容器, 生成的是与媒体同名的空文件
    # 必须使用本项目反代 openlist 才可以正常播放
    #
    # 若媒体元数据可通过 TMDB 刮削, 则配置于此, 不区分大小写
    #
    # 默认写入视频时长 3 小时, 若开启 ffmpeg 辅助, 则会尝试解析视频真实时长, !!有风控风险谨慎开启!!
    virtual-containers: mp4,mkv
    # strm 媒体容器, 生成的是与媒体名称相同的 strm 文件
    # 通过 emby 源端口也可能正常播放
    strm-containers: ts
    # 音乐媒体容器, 生成的是与媒体同名的空文件
    # 必须使用本项目反代 openlist 才可以正常播放
    # 必须开启 ffmpeg 辅助才能解析音频时长以及音乐标签数据到空文件中, !!有风控风险谨慎开启!!
    #
    # 未开启 ffmpeg 辅助时, 由 strm 容器代替
    music-containers: mp3,flac
    # 程序自动删除文件的最大数量
    #
    # 当检测到 openlist 目录树与本地比较缺失文件数量大于这个值时
    # 程序会认为 openlist 出现挂载异常, 不对本地目录树进行删除操作
    # 建议配置为 openlist 数据量的 3/4 左右
    auto-remove-max-count: 6000
    refresh-interval: 10 # 与远程同步刷新的间隔, 单位: 分钟
    scan-prefixes: # 指定要扫描的目录树前缀, 不指定则全量扫描
      - /电影/G
      - /电视剧
    # 允许处理的容器, 为空则允许所有容器
    # 只有指定的容器会被处理, 其他容器会被忽略, 避免触发源文件下载到本地
    allow-containers: ass,srt,sub
    # 同步线程数
    threads: 8

# 该配置项目前只对阿里云盘生效, 如果你使用的是其他网盘, 请直接将 enable 设置为 false
video-preview:
  enable: true # 是否开启 openlist 转码资源信息获取
  containers: # 对哪些视频容器获取转码资源信息
    - mp4
    - mkv
  ignore-template-ids: # 忽略哪些转码清晰度
    - LD
    - SD

path:
  # emby 挂载路径和 openlist 真实路径之间的前缀映射
  # 冒号左边表示本地挂载路径, 冒号右边表示 openlist 的真实路径
  # 这个配置请再三确认配置正确, 可以减少很多不必要的网络请求
  emby2openlist:
    - /movie:/电影
    - /music:/音乐
    - /show:/综艺
    - /series:/电视剧
    - /sport:/运动
    - /animation:/动漫

# GD 管理面板直链配置
#
# 启用后, strm 内容是 Google Drive 挂载点下的本地路径时不再回源给 Emby 读取,
# 而是去掉挂载前缀得到团队盘内的逻辑路径, 交给 GD 管理面板换取直链与请求头,
# 再由本项目把字节流代理给客户端 —— 既不经过 Emby 服务器, 也不经过自建 Drive API。
#
# 任何环节失败都会自动回退到回源处理, 因此可以安全地灰度启用。
gdrive:
  # 总开关; 关闭时行为与未部署本功能完全一致
  enable: false
  # GD 管理面板地址
  #
  # 接口固定拼接为 {api-base}/api/dl; 结尾的 '/' 会被自动去掉。
  # 面板挂在反向代理的子路径下时, 把子路径一并写进来即可(如 https://example.com/gd)。
  api-base: "https://gd.bjyt.de/"
  # 面板的【直链服务】Token
  #
  # !! 等同于账号访问权, config.yml 的文件权限建议设置为 600 !!
  #
  # 注意面板有两枚 Token(直链服务 / 缓存服务), 两枚不通用, 用错会得到 401。
  # 在管理界面「直链服务」页可以看到调用 Token(默认掩码显示)。
  #
  # 也可以用环境变量 GDRIVE_API_TOKEN 覆盖本项(非空即覆盖, 留空表示不覆盖),
  # 容器部署时建议走环境变量, 避免把明文令牌写进配置文件。
  api-token: ""
  # strm 内容里指向 Google Drive 挂载点的前缀
  #
  # strm 内容是 rclone 挂载点下的本地路径(如 /home/googleDrive/影视库/...),
  # 命中该前缀后去掉它, 剩下的部分即团队盘内的路径 ——
  # 该前缀是为 Emby 读取元数据而存在的, 团队盘里并没有这一层。
  #
  # 必须: 以 / 开头, 且不以 / 结尾(否则去掉前缀后会拼出 // 开头的路径)
  # 用 /home/googleDrive 之外的前缀时改这里; 留空表示不按挂载路径触发本功能
  mount-prefix: /home/googleDrive

# agent 代理网络(master 侧)配置
#
# 启用后, 命中 Google Drive 挂载路径的播放请求会先在本网关内选点:
# 有可用节点就把客户端 302 到节点上的签名地址, 媒体字节不经过本网关;
# 没有任何可用节点时按 fallback-to-local 决定回退本机代理还是返回 503。
#
# 关闭时行为与未部署本功能完全一致, 可以安全地灰度启用。
agent-network:
  # 总开关
  enable: false
  # 节点注册 Token(建议至少 16 个字符)
  #
  # !! 等同于"可以往本网关注册一台节点"的凭据, config.yml 的文件权限建议设置为 600 !!
  #
  # 也可以用环境变量 AGENT_ENROLL_TOKEN 覆盖本项(非空即覆盖, 留空表示不覆盖),
  # 容器部署时建议走环境变量, 避免把明文 Token 写进配置文件。
  # 轮换 = 修改本项并重启: 旧 Token 立即失效, 已注册节点不受影响。
  enroll-token: ""
  # 离线判定秒数(必须大于心跳周期 15 秒), 默认 45
  #
  # 超过该时长没有收到心跳的节点不再被调度; 不做自动删除,
  # 进程恢复后的下一次心跳即回归。
  offline-seconds: 45
  # 客户端 URL 的签名时效, 可配置单位: d(天), h(小时), m(分钟), s(秒)
  #
  # 时效内已签发的 URL 不受节点禁用/删除影响(密钥随节点记录一起删除时才立即失效);
  # 超过时效后客户端会重新请求播放入口, 可能被调度到别的节点。
  # 默认: 24h
  url-ttl: 24h
  # 没有任何可用节点时, 是否回退到本机直链代理(即 gdrive 那套流程)
  #
  # 关闭后直接返回 503, 便于排查"节点为什么没上来"; 默认开启(保持播放可用)。
  fallback-to-local: true

cache:
  # 是否启用缓存中间件
  # 推荐启用, 既可以缓存 Emby 的大接口以及静态资源, 又可以缓存网盘直链, 避免频繁请求
  enable: true
  # 缓存过期时间
  #
  # 可配置单位: d(天), h(小时), m(分钟), s(秒)
  #
  # 该配置不会影响特殊接口的缓存时间
  # 比如直链获取接口的缓存时间固定为 10m, 字幕获取接口的缓存时间固定为 30d
  expired: 1d

ssl:
  enable: false # 是否启用 https
  # 是否使用单一端口
  #
  # 启用: 程序会在 8094 端口上监听 https 连接, 不监听 http
  # 不启用: 程序会在 8094 端口上监听 https 连接, 在 8095 端口上监听 http 连接
  single-port: false
  key: testssl.cn.key # 私钥文件名
  crt: testssl.cn.crt # 证书文件名

log:
  # 是否禁用控制台彩色日志
  #
  # 程序默认是输出彩色日志的,
  # 如果你的终端不支持彩色输出, 并且多出来一些乱码字符
  # 可以将该项设置为 true
  disable-color: false

ge2o:
  # api 本地密钥, 必须配置后才能启用接口调用
  api-secret: my-secret
  # web 平台相关配置
  web:
    # 是否禁用 web 平台
    disable: false
    # 是否禁用 emby 快速进入 web 平台的辅助按钮
    disable-emby-btn: false
